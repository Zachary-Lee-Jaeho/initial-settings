# 기존: set -g default-terminal "screen-256color"                           
set -g default-terminal "tmux-256color"                                     
set -ga terminal-overrides ",xterm-256color:RGB" 

# Use F-keys
unbind C-b
set-option -g prefix F2
bind-key F2 send-prefix
bind-key -n F3 new-window
bind-key -n F9 detach

#  Use ZSH as default shell
set-option -g default-shell /usr/bin/zsh

# 0 is too far from ` ;)
set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

#set -g default-terminal screen-256color
set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
set -g mouse on
setw -g monitor-activity on

# Remove status bar missing
set -g window-size latest                                                 

set -g extended-keys on  # modified Enter keys (Shift+Enter, ...)

setw -g aggressive-resize on    


## Clipboard integration
# ctrl+c to send to clipboard
bind C-c run "tmux save-buffer - | xclip -i -sel clipboard"
# ctrl+v to paste from clipboard
bind C-v run "tmux set-buffer \"$(xclip -o -sel clipboard)\"; tmux paste-buffer"


bind-key v split-window -h
bind-key s split-window -v

## Use Alt-arrow keys without prefix key to switch panes
#bind -n M-Left select-pane -L
#bind -n M-Right select-pane -R
#bind -n M-Up select-pane -U
#bind -n M-Down select-pane -D
# ---> Vim friendly
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

## Shift arrow to switch windows
#bind -n S-Left  previous-window
#bind -n S-Right next-window
# ---> Vim friendly
bind -n C-M-h previous-window
bind -n C-M-l next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# THEME
set -g status-bg black
set -g status-fg white
#set -g window-status-current-style bg=white, fg=black, attr=bold
set-window-option -g window-status-current-style fg=black,bg=white
set -g status-interval 60
set -g status-left-length 30
set -g status-left '#[fg=green](#S) #(whoami)'
set -g status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg)#[default] #[fg=white]%H:%M#[default]'

# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Save/Restore session plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Keep snapshots on the shared home so they can be restored on another node.
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'

# Initialize Tmux Plugin Manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
